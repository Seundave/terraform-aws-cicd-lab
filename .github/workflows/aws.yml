name: Test AWS OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::322513862609:role/GitHubActionsCICDLabRole
          aws-region: us-east-1

      - name: Verify identity
        run: aws sts get-caller-identity 